[package]
name = "rgit-core"
version = "0.1.0"
edition = "2024"
authors = ["cyberia <cyberia@donk.systems>"]
license = "MIT OR Apache-2.0"
description = "An async-aware git library"
keywords = ["async", "git"]
categories = ["no-std", "development-tools"]
readme = "README.md"

[dependencies]
accessory = "2.1.0"
chrono = { version = "0.4.44", default-features = false, features = ["alloc"] }
hex = { version = "0.4.3", default-features = false, features = [] }
miniz_oxide = "0.9.1"
nom = { version = "8.0.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
serde_bytes = { version = "0.11.19", default-features = false, features = [
  "alloc"
], optional = true }
similar = { version = "3.1.0", default-features = false, features = ["bytes"], optional = true }

[dev-dependencies]
futures = "0.3.32"
hex-literal = "1.1.0"
rand_core = "0.10.0"
rand_pcg = "0.10.1"
rmp-serde = "1.3.1"
serde_cbor = "0.11.2"
serde_json = "1.0.149"
tempfile = "3.27.0"

[features]
default = ["diff", "serde"]
diff = ["dep:similar"]
serde = ["chrono/serde", "dep:serde", "dep:serde_bytes", "similar/serde"]
